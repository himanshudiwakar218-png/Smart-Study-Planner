# Server Configuration
server.port=${PORT:8080}

# Application Base Path is /api
spring.mvc.servlet.path=/

# SQLite Database Configuration
# Location of the database file can be overridden via SQLITE_DB_FILE env variable
sqlite.db-file=${SQLITE_DB_FILE:data/study-planner.db}
spring.datasource.url=jdbc:sqlite:${sqlite.db-file}
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Sample Data Seeding (Disabled by default)
app.sample-data.enabled=${SAMPLE_DATA_ENABLED:false}

# CORS Configuration - comma separated list of allowed origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}
