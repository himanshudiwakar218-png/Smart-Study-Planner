# Test Application Properties
server.port=0

# Isolated temporary test database in target directory
sqlite.db-file=target/test-db/test-study-planner.db
spring.datasource.url=jdbc:sqlite:${sqlite.db-file}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080
