<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E40AF" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="20" y="20" width="160" height="160" rx="36" fill="url(#gradPrimary)" filter="url(#shadow)" />
  
  <!-- Inner subtle backdrop -->
  <rect x="28" y="28" width="144" height="144" rx="28" fill="#FFFFFF" fill-opacity="0.08" />
  
  <!-- Graduation Cap Top -->
  <polygon points="100,56 150,78 100,100 50,78" fill="#FFFFFF" />
  
  <!-- Cap Skull Base -->
  <path d="M68,90 L68,114 C68,128 132,128 132,114 L132,90 L100,103 Z" fill="url(#gradAccent)" />
  
  <!-- Tassel Cord & Bead -->
  <path d="M142,75 L156,92 L156,122" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="156" cy="125" r="5" fill="#F59E0B" />
  
  <!-- Open Book Pages beneath -->
  <path d="M60,140 Q100,126 100,146 Q100,126 140,140 L140,154 Q100,140 100,158 Q100,140 60,154 Z" fill="#FFFFFF" />
  
  <!-- Center Bookmark / Sparkle -->
  <line x1="100" y1="130" x2="100" y2="158" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
</svg>
